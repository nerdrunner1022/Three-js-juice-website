<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17130F" />

    <!-- Core SEO Meta Tags -->
    <title>PureSqueeze — 100% Raw Cold-Pressed Organic Juice</title>
    <meta
      name="description"
      content="PureSqueeze delivers 100% raw, cold-pressed fruit juices pressed within hours of harvest. No heat, no concentrate, no additives — just pure, vibrant fruit."
    />
    <link rel="canonical" href="https://puresqueeze.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://puresqueeze.com/" />
    <meta property="og:title" content="PureSqueeze — 100% Raw Cold-Pressed Organic Juice" />
    <meta property="og:description" content="Pressed, not processed. Pure cold-pressed juice harvested and squeezed fresh with zero additives." />
    <meta property="og:site_name" content="PureSqueeze" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PureSqueeze — 100% Raw Cold-Pressed Organic Juice" />
    <meta name="twitter:description" content="Pressed, not processed. Pure cold-pressed juice harvested and squeezed fresh with zero additives." />

    <!-- Typography Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PureSqueeze",
        "url": "https://puresqueeze.com",
        "logo": "https://puresqueeze.com/favicon.svg",
        "description": "100% raw, cold-pressed fruit juice pressed within hours of harvest with zero additives.",
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
